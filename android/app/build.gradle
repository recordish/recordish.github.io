// Recordish 안드로이드 앱 (TWA: https://recordish.github.io 를 앱처럼 띄움)
plugins {
    id 'com.android.application'
}

// 서명 정보: android/keystore.properties (git에 올리지 않음) 또는 환경 변수
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def sign = { String key, String env -> signingProps.getProperty(key) ?: System.getenv(env) }

android {
    namespace 'com.recordish.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.recordish.app'
        minSdk 24  // Android 7.0 이상 (androidbrowserhelper 최소 요구)
        targetSdk 36
        // 새 버전을 올릴 때마다 versionCode 를 1씩 올려야 합니다
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        release {
            if (sign('storeFile', 'RECORDISH_KEYSTORE')) {
                storeFile rootProject.file(sign('storeFile', 'RECORDISH_KEYSTORE'))
                storePassword sign('storePassword', 'RECORDISH_KEYSTORE_PASSWORD')
                keyAlias sign('keyAlias', 'RECORDISH_KEY_ALIAS')
                keyPassword sign('keyPassword', 'RECORDISH_KEY_PASSWORD')
            }
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                it.testLogging { events 'failed', 'passed'; exceptionFormat 'full'; showStandardStreams true }
                // 미리 받아 둔 안드로이드 환경 파일만 사용 (인터넷에서 받지 않음)
                it.systemProperty 'robolectric.offline', 'true'
                it.systemProperty 'robolectric.dependency.dir', '/home/user/robolectric-jars'
                it.jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.lang=ALL-UNNAMED'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            if (sign('storeFile', 'RECORDISH_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'

    // 실행 확인용 테스트 (Robolectric: 기기 없이 안드로이드 환경을 흉내 냄)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}

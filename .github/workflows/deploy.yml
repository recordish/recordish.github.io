# main 브랜치에 푸시하면 메모 앱을 빌드해서 GitHub Pages에 배포합니다.
#   → https://recordishapp.com/
#
# 사전 설정: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 변경
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install & lint & build
        # Firebase 설정값은 저장소의 .env.production 에서 읽습니다.
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/configure-pages@v5

      # v4 는 점(.)으로 시작하는 파일을 빼고 올려서, 안드로이드 앱 연결 파일(.well-known/assetlinks.json)이
      # 사이트에 올라가지 않습니다. 숨김 파일을 그대로 올리는 v3 를 씁니다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8ec96d" />
  <title>오프라인 · Recordish</title>
  <style>
    :root { --bg: #f6f7f9; --text: #1f2328; --muted: #6b7280; --primary: #8ec96d; --primary-strong: #3d8526; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111318; --text: #e6e7ea; --muted: #9aa0aa; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { font: inherit; font-weight: 700; padding: 10px 20px; border: none; border-radius: 8px; background: var(--primary-strong); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
